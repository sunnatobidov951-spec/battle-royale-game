<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Royale - Pro Edition</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: sans-serif;
            touch-action: none;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* HUD интерфейс */
        .hud {
            position: absolute; pointer-events: none; color: #fff;
            text-shadow: 1px 1px 2px #000; font-weight: bold;
        }
        #top-left { top: 15px; left: 15px; }
        #top-right { top: 15px; right: 15px; text-align: right; }
        .bar { background: rgba(0,0,0,0.5); border: 2px solid #444; border-radius: 4px; padding: 5px 10px; margin-bottom: 5px; font-size: 14px; }
        .health { color: #ff4444; }
        .ammo { color: #ffeb3b; }

        /* Джойстик и кнопки управления */
        .controls { position: absolute; bottom: 20px; width: 100%; pointer-events: none; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        .joystick-zone { width: 130px; height: 130px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; position: relative; }
        .joystick-knob { width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; position: absolute; top: 40px; left: 40px; pointer-events: none; }
        
        .action-buttons { pointer-events: auto; display: flex; gap: 10px; align-items: flex-end; }
        .btn { width: 70px; height: 70px; border-radius: 50%; border: none; font-weight: bold; color: #fff; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); outline: none; cursor: pointer; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
        #btn-fire { background: #d32f2f; width: 85px; height: 85px; font-size: 16px; }
        #btn-reload { background: #1976d2; }
        #btn-shop { background: #388e3c; }

        /* Прицел в центре */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.8);
        }
        #crosshair::before { top: 4px; left: -5px; width: 20px; height: 2px; }
        #crosshair::after { top: -5px; left: 4px; width: 2px; height: 20px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <!-- HUD -->
    <div id="top-left" class="hud">
        <div class="bar">❤️ HP: <span id="hp-val" class="health">100</span></div>
        <div class="bar">🛡️ Armor: <span id="armor-val">50</span></div>
    </div>
    <div id="top-right" class="hud">
        <div class="bar">🔫 <span id="weapon-val">Assault Rifle</span></div>
        <div class="bar ammo">30 / <span id="ammo-val">120</span></div>
    </div>

    <!-- Контроллеры -->
    <div class="controls">
        <div id="joystick" class="joystick-zone">
            <div id="joystick-knob" class="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <button id="btn-shop" class="btn">Shop</button>
            <button id="btn-reload" class="btn">Reload</button>
            <button id="btn-fire" class="btn">Fire</button>
        </div>
    </div>

    <!-- Подключаем Three.js через CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Инициализация сцены, камеры и рендерера
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Небесный цвет
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(100, 200, 100);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // Земля (Карта 500x500)
        const groundGeo = new THREE.PlaneGeometry(500, 500, 32, 32);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b7a2b, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- СОЗДАНИЕ КАЧЕСТВЕННОГО ПЕРСОНАЖА (ИГРОКА) ---
        const playerGroup = new THREE.Group();

        // Торс
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e3d59 });
        const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.4);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.0;
        body.castShadow = true;
        playerGroup.add(body);

        // Голова
        const headMat = new THREE.MeshStandardMaterial({ color: 0xd4a373 });
        const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.8;
        head.castShadow = true;
        playerGroup.add(head);

        // Оружие в руках
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 1.2);
        const gun = new THREE.Mesh(gunGeo, gunMat);
        gun.position.set(0.4, 1.1, 0.6);
        playerGroup.add(gun);

        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 0);

        // --- ОКРУЖЕНИЕ (ДЕРЕВЬЯ, КАМНИ, ДОМ, ТАНК) ---

        // Функция создания низкополигонального дерева
        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            
            // Ствол
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 6);
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            // Крона
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });
            const leavesGeo = new THREE.ConeGeometry(1.8, 3, 6);
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 3;
            leaves.castShadow = true;
            treeGroup.add(leaves);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        // Генерация леса вокруг
        for(let i = 0; i < 40; i++) {
            let x = (Math.random() - 0.5) * 300;
            let z = (Math.random() - 0.5) * 300;
            if(Math.abs(x) > 10 || Math.abs(z) > 10) {
                createTree(x, z);
            }
        }

        // Дом (База)
        const houseGroup = new THREE.Group();
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xdcdcdc });
        const wallGeo = new THREE.BoxGeometry(10, 5, 10);
        const walls = new THREE.Mesh(wallGeo, wallMat);
        walls.position.y = 2.5;
        walls.castShadow = true;
        houseGroup.add(walls);

        const roofMat = new THREE.MeshStandardMaterial({ color: 0xb22222 });
        const roofGeo = new THREE.ConeGeometry(8, 4, 4);
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 6.5;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        houseGroup.add(roof);

        houseGroup.position.set(25, 0, -25);
        scene.add(houseGroup);

        // Танк / Машина
        const tankGroup = new THREE.Group();
        const tankBaseMat = new THREE.MeshStandardMaterial({ color: 0x556b2f });
        const tankBaseGeo = new THREE.BoxGeometry(4, 1.5, 6);
        const tankBase = new THREE.Mesh(tankBaseGeo, tankBaseMat);
        tankBase.position.y = 0.75;
        tankBase.castShadow = true;
        tankGroup.add(tankBase);

        const turretGeo = new THREE.CylinderGeometry(1.2, 1.4, 1, 12);
        const turret = new THREE.Mesh(turretGeo, tankBaseMat);
        turret.position.y = 1.8;
        tankGroup.add(turret);

        const barrelGeo = new THREE.CylinderGeometry(0.2, 0.2, 4, 8);
        const barrel = new THREE.Mesh(barrelGeo, new THREE.MeshStandardMaterial({ color: 0x222222 }));
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 1.8, 2.5);
        tankGroup.add(barrel);

        tankGroup.position.set(-20, 0, -15);
        scene.add(tankGroup);

        // Управление камерой и движением
        let moveX = 0, moveZ = 0;
        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('joystick-knob');
        let isDragging = false;
        let joyCenter = { x: 0, y: 0 };

        joystick.addEventListener('pointerdown', (e) => {
            isDragging = true;
            const rect = joystick.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let dx = e.clientX - joyCenter.x;
            let dy = e.clientY - joyCenter.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let maxDist = 40;
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxDist;
            moveZ = dy / maxDist;
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            moveX = 0; moveZ = 0;
            knob.style.transform = `translate(0px, 0px)`;
        });

        // Игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            // Движение игрока
            if (moveX !== 0 || moveZ !== 0) {
                playerGroup.position.x += moveX * 0.3;
                playerGroup.position.z += moveZ * 0.3;
                playerGroup.rotation.y = Math.atan2(moveX, moveZ);
            }

            // Плавное следование камеры за игроком (вид от 3-го лица в стиле PUBG)
            camera.position.x = playerGroup.position.x - Math.sin(playerGroup.rotation.y) * 6;
            camera.position.y = playerGroup.position.y + 4;
            camera.position.z = playerGroup.position.z - Math.cos(playerGroup.rotation.y) * 6;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // Адаптация при изменении размера экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
