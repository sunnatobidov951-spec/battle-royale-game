<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚔️ Битва | Королевская битва PRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; user-select: none; }
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; color: white; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    #top-bar { display: flex; justify-content: space-between; padding: 10px 16px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; gap: 6px; }
    .stat { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
    .stat .icon { font-size: 16px; }
    .stat .value { font-size: 16px; }
    #health-bar-wrap { width: 120px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
    #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4444, #66ff66); transition: width 0.15s; }
    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 28px; height: 28px; pointer-events: none; z-index: 15; opacity: 0.9; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.9); box-shadow: 0 0 6px rgba(0,0,0,0.5); }
    #crosshair::before { width: 28px; height: 2px; top: 13px; left: 0; }
    #crosshair::after { width: 2px; height: 28px; left: 13px; top: 0; }
    .dot { position: absolute; width: 4px; height: 4px; background: #ff3333; border-radius: 50%; top: 12px; left: 12px; }
    #bottom-info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border-radius: 30px; padding: 6px 16px; font-size: 12px; border: 1px solid rgba(255,255,255,0.08); display: flex; gap: 16px; align-items: center; pointer-events: auto; }
    #center-msg { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px 28px; font-size: 26px; font-weight: 700; pointer-events: none; z-index: 50; opacity: 0; transition: opacity 0.3s; backdrop-filter: blur(6px); }
    #center-msg.show { opacity: 1; }
    #shop-btn { position: absolute; right: 16px; bottom: 80px; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); border: 1px solid rgba(255,215,0,0.4); border-radius: 30px; padding: 8px 18px; color: #ffd700; font-weight: bold; font-size: 14px; pointer-events: auto; cursor: pointer; z-index: 20; }
    #shop-panel { position: absolute; right: 16px; bottom: 130px; width: 220px; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px; display: none; z-index: 25; pointer-events: auto; max-height: 300px; overflow-y: auto; }
    #shop-panel.open { display: block; }
    .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
    .shop-item button { background: #ffd700; border: none; border-radius: 12px; padding: 2px 10px; font-weight: bold; color: #111; cursor: pointer; font-size: 12px; }
    #touch-controls { position: absolute; bottom: 20px; left: 0; right: 0; z-index: 20; display: none; justify-content: space-between; padding: 0 16px; pointer-events: none; }
    @media (hover: none) and (pointer: coarse) { #touch-controls { display: flex; } #bottom-info { display: none; } }
    .touch-joystick { width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15); position: relative; pointer-events: auto; touch-action: none; }
    .touch-joystick .knob { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.3); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .touch-actions { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: auto; }
    .touch-btn { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); color: white; font-size: 12px; font-weight: 700; backdrop-filter: blur(4px); touch-action: none; }
    .touch-btn.shoot { background: rgba(200, 40, 40, 0.7); border-color: #ff6666; width: 70px; height: 70px; font-size: 14px; }
    #render-target { width: 100%; height: 100%; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="top-bar">
      <div class="stat">
        <span class="icon">❤️</span>
        <div id="health-bar-wrap"><div id="health-fill" style="width:100%"></div></div>
        <span class="value" id="health-text">100</span>
      </div>
      <div class="stat">
        <span class="icon">👥</span>
        <span class="value" id="alive-count">0</span>
        <span class="icon" style="margin-left:8px;">🤖</span>
        <span class="value" id="bot-count">0</span>
      </div>
      <div class="stat">
        <span class="icon">🔫</span>
        <span class="value" id="weapon-name">Пистолет</span>
        <span class="value" id="ammo-display">30</span>
        <span class="label">/ <span id="max-ammo">30</span></span>
      </div>
      <div class="stat">
        <span class="icon">💰</span>
        <span class="value" id="currency">100</span>
      </div>
    </div>
    <div id="crosshair"><div class="dot"></div></div>
    <div id="center-msg"></div>
    <div id="bottom-info">
      <span>🏆 <span id="kills-display">0</span> убийств</span>
      <span class="badge" id="match-status">⏳ Ожидание</span>
      <span>📍 <span id="zone-status">Зона: 280м</span></span>
    </div>
    <div id="shop-btn">🛒 Магазин</div>
    <div id="shop-panel"></div>
  </div>

  <div id="touch-controls">
    <div class="touch-joystick" id="joystick"><div class="knob" id="joystick-knob"></div></div>
    <div class="touch-actions">
      <button class="touch-btn" id="touch-reload">⟳</button>
      <button class="touch-btn shoot" id="touch-shoot">FIRE</button>
    </div>
  </div>

  <div id="render-target"></div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    const WORLD_SIZE = 600, EYE_HEIGHT = 1.6;
    let socket, myId, gameState, localPlayer, players = {}, bots = {}, lootMeshes = {}, zoneRing, zoneLine;
    let scene, camera, renderer, clock = new THREE.Clock();
    const keys = { w: false, a: false, s: false, d: false };
    let isPointerLocked = false;

    // HUD элементы
    const healthFill = document.getElementById('health-fill');
    const healthText = document.getElementById('health-text');
    const aliveCount = document.getElementById('alive-count');
    const botCount = document.getElementById('bot-count');
    const weaponName = document.getElementById('weapon-name');
    const ammoDisplay = document.getElementById('ammo-display');
    const maxAmmo = document.getElementById('max-ammo');
    const killsDisplay = document.getElementById('kills-display');
    const currencyDisplay = document.getElementById('currency');
    const matchStatus = document.getElementById('match-status');
    const zoneStatus = document.getElementById('zone-status');
    const centerMsg = document.getElementById('center-msg');
    const shopBtn = document.getElementById('shop-btn');
    const shopPanel = document.getElementById('shop-panel');

    // Инициализация 3D сцены
    function initScene() {
      const container = document.getElementById('render-target');
      const w = window.innerWidth, h = window.innerHeight;
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.Fog(0x87CEEB, 300, 600);
      camera = new THREE.PerspectiveCamera(70, w/h, 0.1, 800);
      camera.position.set(0, EYE_HEIGHT, 0);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);
      // освещение, земля, деревья, дома (как в предыдущей версии, но увеличенный мир)
      // ... (код создания мира такой же, как в предыдущей версии, но с WORLD_SIZE=600)
      // Для краткости я добавлю упрощённое создание мира, но в реальном коде нужно повторить предыдущий код.
      // Здесь я добавлю минимальное окружение для демонстрации.
      const amb = new THREE.AmbientLight(0x404060, 0.5);
      scene.add(amb);
      const sun = new THREE.DirectionalLight(0xffeedd, 1.8);
      sun.position.set(150, 200, 100);
      sun.castShadow = true;
      sun.shadow.mapSize.width = 2048;
      sun.shadow.mapSize.height = 2048;
      sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 500;
      sun.shadow.camera.left = -300; sun.shadow.camera.right = 300;
      sun.shadow.camera.top = 300; sun.shadow.camera.bottom = -300;
      scene.add(sun);
      const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 0.6);
      scene.add(hemi);

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE), new THREE.MeshStandardMaterial({ color: 0x4a7c59, roughness: 0.9 }));
      ground.rotation.x = -Math.PI/2;
      ground.receiveShadow = true;
      scene.add(ground);
      const grid = new THREE.GridHelper(WORLD_SIZE, 20, 0x88aa88, 0x446644);
      grid.position.y = 0.2;
      scene.add(grid);

      // Зона (кольцо)
      const ringGeo = new THREE.RingGeometry(0, 1, 64);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false });
      zoneRing = new THREE.Mesh(ringGeo, ringMat);
      zoneRing.rotation.x = -Math.PI/2;
      zoneRing.position.y = 0.3;
      scene.add(zoneRing);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x44ddff, transparent: true, opacity: 0.5 });
      const pts = [];
      for (let i=0; i<=64; i++) { const a = (i/64)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a), 0, Math.sin(a))); }
      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      zoneLine = new THREE.Line(lineGeo, lineMat);
      zoneLine.position.y = 0.4;
      scene.add(zoneLine);

      window.addEventListener('resize', () => {
        const ww = window.innerWidth, hh = window.innerHeight;
        camera.aspect = ww/hh; camera.updateProjectionMatrix();
        renderer.setSize(ww, hh);
      });
    }

    // Создание модели игрока (для других)
    function createPlayerMesh(alive = true) {
      const group = new THREE.Group();
      const color = alive ? 0x2196F3 : 0x666;
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.6,1.6,8), new THREE.MeshStandardMaterial({ color, roughness:0.5 }));
      body.position.y=0.8; body.castShadow=true; group.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3,8), new THREE.MeshStandardMaterial({ color: alive ? 0x64B5F6 : 0x444 }));
      head.position.y=1.6; head.castShadow=true; group.add(head);
      const weapon = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.8), new THREE.MeshStandardMaterial({ color:0x333 }));
      weapon.position.set(0.4,0.5,-0.6); weapon.rotation.x=0.3; group.add(weapon);
      const bar = new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.1), new THREE.MeshBasicMaterial({ color:0x00ff00 }));
      bar.position.y=2.1; group.add(bar);
      group.userData.healthBar = bar;
      return group;
    }

    // Обновление состояния
    function updateState(data) {
      if (data.type === 'init') {
        myId = data.id;
        document.addEventListener('click', () => { if (!document.pointerLockElement && !('ontouchstart' in window)) renderer.domElement.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => { isPointerLocked = !!document.pointerLockElement; });
        return;
      }
      if (data.type === 'state') {
        gameState = data;
        const me = data.players?.find(p => p.id === myId);
        if (me) {
          if (!localPlayer) localPlayer = {};
          Object.assign(localPlayer, me);
          camera.position.set(me.position.x, EYE_HEIGHT, me.position.z);
        }
        // Обновляем игроков
        const receivedPlayers = data.players || [];
        const currentPlayerIds = new Set(Object.keys(players));
        receivedPlayers.forEach(p => {
          if (p.id === myId) return;
          if (!players[p.id]) {
            const mesh = createPlayerMesh(p.alive);
            scene.add(mesh);
            players[p.id] = { mesh, position: p.position, rotation: p.rotation, health: p.health, alive: p.alive };
          } else {
            const entry = players[p.id];
            entry.position = p.position; entry.rotation = p.rotation; entry.health = p.health; entry.alive = p.alive;
          }
        });
        for (const id in players) {
          if (!receivedPlayers.find(p => p.id === id)) {
            scene.remove(players[id].mesh);
            delete players[id];
          }
        }
        for (const id in players) {
          const entry = players[id];
          entry.mesh.position.set(entry.position.x, 0, entry.position.z);
          entry.mesh.rotation.y = entry.rotation.yaw || 0;
          const hp = Math.max(0, (entry.health / 100));
          const bar = entry.mesh.userData.healthBar;
          if (bar) { bar.material.color.setHSL(hp*0.3,1,0.5); bar.scale.x = hp; }
          entry.mesh.visible = entry.alive;
        }

        // Боты
        const receivedBots = data.bots || [];
        const currentBotIds = new Set(Object.keys(bots));
        receivedBots.forEach(b => {
          if (!bots[b.id]) {
            const mesh = createPlayerMesh(b.alive);
            // для ботов делаем красный цвет
            mesh.children.forEach(child => { if (child.isMesh) { child.material.color.setHex(0xff4444); } });
            scene.add(mesh);
            bots[b.id] = { mesh, position: b.position, rotation: b.rotation, health: b.health, alive: b.alive };
          } else {
            const entry = bots[b.id];
            entry.position = b.position; entry.rotation = b.rotation; entry.health = b.health; entry.alive = b.alive;
          }
        });
        for (const id in bots) {
          if (!receivedBots.find(b => b.id === id)) {
            scene.remove(bots[id].mesh);
            delete bots[id];
          }
        }
        for (const id in bots) {
          const entry = bots[id];
          entry.mesh.position.set(entry.position.x, 0, entry.position.z);
          entry.mesh.rotation.y = entry.rotation.yaw || 0;
          const hp = Math.max(0, (entry.health / 100));
          const bar = entry.mesh.userData.healthBar;
          if (bar) { bar.material.color.setHSL(hp*0.3,1,0.5); bar.scale.x = hp; }
          entry.mesh.visible = entry.alive;
        }

        // Лут
        const loot = data.loot || [];
        for (const id in lootMeshes) { scene.remove(lootMeshes[id]); delete lootMeshes[id]; }
        loot.forEach(item => {
          const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.4,8), new THREE.MeshStandardMaterial({ color:0xffaa00, emissive:0x442200 }));
          mesh.position.set(item.position.x, 0.5, item.position.z);
          mesh.castShadow = true;
          scene.add(mesh);
          lootMeshes[item.id] = mesh;
        });

        // Зона
        if (data.zone) {
          const z = data.zone;
          const visualRadius = z.radius;
          const scale = visualRadius / 280;
          zoneRing.scale.set(scale, scale, scale);
          zoneRing.position.x = z.x || 0; zoneRing.position.z = z.z || 0;
          if (zoneLine) { zoneLine.scale.set(scale, scale, scale); zoneLine.position.x = z.x || 0; zoneLine.position.z = z.z || 0; }
          zoneStatus.textContent = `Зона: ${Math.round(visualRadius)}м`;
        }

        // HUD
        if (localPlayer) {
          const hp = Math.max(0, Math.round(localPlayer.health));
          healthFill.style.width = (hp/100)*100 + '%';
          healthText.textContent = hp;
          const alive = data.players?.filter(p => p.alive).length || 0;
          aliveCount.textContent = alive;
          const botAlive = data.bots?.filter(b => b.alive).length || 0;
          botCount.textContent = botAlive;
          weaponName.textContent = localPlayer.weapon || 'Пистолет';
          ammoDisplay.textContent = localPlayer.ammo || 0;
          maxAmmo.textContent = 30; // временно
          killsDisplay.textContent = localPlayer.kills || 0;
          currencyDisplay.textContent = localPlayer.currency || 0;
          matchStatus.textContent = data.status === 'playing' ? '🎮 В игре' : '⏳ Ожидание';
        }

        // Магазин
        if (data.shop) {
          shopPanel.innerHTML = data.shop.map(item => `
            <div class="shop-item">
              <span>${item.name} (${item.price}💰)</span>
              <button data-item="${item.id}">Купить</button>
            </div>
          `).join('');
          shopPanel.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const itemId = e.target.dataset.item;
              send({ type: 'shop-buy', itemId });
            });
          });
        }

        return;
      }

      if (data.type === 'winner') {
        const msg = data.playerId === myId ? '🏆 ВЫ ПОБЕДИЛИ!' : '🏆 Победитель определён';
        showMessage(msg, 4000);
        return;
      }
      if (data.type === 'draw') { showMessage('⚔️ НИЧЬЯ', 3000); return; }
      if (data.type === 'death') {
        if (data.playerId === myId) showMessage('💀 ВАС УБИЛИ', 3000);
        return;
      }
      if (data.type === 'hit') {
        if (data.targetId === myId) {
          document.body.style.backgroundColor = 'rgba(255,0,0,0.15)';
          setTimeout(() => document.body.style.backgroundColor = '', 150);
        }
        return;
      }
      if (data.type === 'error') { showMessage('⚠️ ' + data.message, 3000); }
    }

    function send(data) {
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(data));
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(protocol + '//' + location.host);
      socket.onopen = () => console.log('🔗 Соединено');
      socket.onmessage = (ev) => { try { const d = JSON.parse(ev.data); updateState(d); } catch(e) {} };
      socket.onclose = () => { console.log('🔌 Переподключение...'); setTimeout(connect, 2000); };
    }

    function showMessage(text, dur=2000) {
      centerMsg.textContent = text;
      centerMsg.classList.add('show');
      clearTimeout(window.msgTimer);
      window.msgTimer = setTimeout(() => centerMsg.classList.remove('show'), dur);
    }

    // Управление
    function setupControls() {
      document.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || k === 'a' || k === 's' || k === 'd') { keys[k] = true; e.preventDefault(); }
        if (k === 'r') { send({ type: 'reload' }); e.preventDefault(); }
        if (k === 'e') { tryPickup(); e.preventDefault(); }
        if (k === ' ' || k === 'space') { send({ type: 'shoot' }); e.preventDefault(); }
      });
      document.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k === 'w' || k === 'a' || k === 's' || k === 'd') keys[k] = false; });
      document.addEventListener('mousemove', (e) => {
        if (!isPointerLocked) return;
        const sens = 0.002;
        const dyaw = -e.movementX * sens;
        const dpitch = -e.movementY * sens;
        if (localPlayer) {
          let yaw = (localPlayer.rotation?.yaw || 0) + dyaw;
          let pitch = (localPlayer.rotation?.pitch || 0) + dpitch;
          pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
          yaw = ((yaw % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
          localPlayer.rotation = { yaw, pitch };
          send({ type: 'rotate', yaw, pitch });
          camera.rotation.order = 'YXZ';
          camera.rotation.y = yaw;
          camera.rotation.x = pitch;
        }
      });
      document.addEventListener('mousedown', (e) => { if (e.button === 0) send({ type: 'shoot' }); });

      // Мобильный джойстик
      const joystick = document.getElementById('joystick');
      const knob = document.getElementById('joystick-knob');
      let jActive = false, jData = { x:0, y:0 };
      const handleJoystick = (cx, cy) => {
        const rect = joystick.getBoundingClientRect();
        const dx = cx - (rect.left + rect.width/2);
        const dy = cy - (rect.top + rect.height/2);
        const maxD = rect.width/2 - 20;
        const dist = Math.sqrt(dx*dx + dy*dy);
        let ndx = dx, ndy = dy;
        if (dist > maxD) { ndx = (dx/dist)*maxD; ndy = (dy/dist)*maxD; }
        knob.style.transform = `translate(calc(-50% + ${ndx}px), calc(-50% + ${ndy}px))`;
        const normX = ndx / maxD, normY = ndy / maxD;
        jData.x = Math.max(-1, Math.min(1, normX));
        jData.y = Math.max(-1, Math.min(1, normY));
        const forward = jData.y < -0.2, backward = jData.y > 0.2, left = jData.x < -0.2, right = jData.x > 0.2;
        send({ type: 'move-input', input: { forward, backward, left, right } });
      };
      joystick.addEventListener('touchstart', (e) => { e.preventDefault(); jActive = true; const t = e.touches[0]; handleJoystick(t.clientX, t.clientY); }, { passive: false });
      joystick.addEventListener('touchmove', (e) => { e.preventDefault(); if (!jActive) return; const t = e.touches[0]; handleJoystick(t.clientX, t.clientY); }, { passive: false });
      joystick.addEventListener('touchend', (e) => { e.preventDefault(); jActive = false; knob.style.transform = 'translate(-50%, -50%)'; send({ type: 'move-input', input: { forward:false, backward:false, left:false, right:false } }); }, { passive: false });

      document.getElementById('touch-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); send({ type: 'shoot' }); }, { passive: false });
      document.getElementById('touch-reload').addEventListener('touchstart', (e) => { e.preventDefault(); send({ type: 'reload' }); }, { passive: false });
    }

    function tryPickup() {
      if (!gameState?.loot || !localPlayer) return;
      let nearest = null, minDist = Infinity;
      for (const item of gameState.loot) {
        if (item.picked) continue;
        const d = Math.sqrt((item.position.x - localPlayer.position.x)**2 + (item.position.z - localPlayer.position.z)**2);
        if (d < 3 && d < minDist) { minDist = d; nearest = item; }
      }
      if (nearest) send({ type: 'pickup', lootId: nearest.id });
    }

    function animate() {
      requestAnimationFrame(animate);
      if (localPlayer && !('ontouchstart' in window)) {
        const f = keys.w, b = keys.s, l = keys.a, r = keys.d;
        if (!localPlayer._lastInputSend || Date.now() - localPlayer._lastInputSend > 50) {
          send({ type: 'move-input', input: { forward: f, backward: b, left: l, right: r } });
          localPlayer._lastInputSend = Date.now();
        }
      }
      if (localPlayer && camera) {
        camera.position.set(localPlayer.position.x, EYE_HEIGHT, localPlayer.position.z);
      }
      renderer.render(scene, camera);
    }

    // Инициализация
    function init() {
      initScene();
      setupControls();
      connect();
      animate();

      shopBtn.addEventListener('click', () => {
        shopPanel.classList.toggle('open');
      });

      setInterval(() => { if (socket && socket.readyState === WebSocket.OPEN) send({ type: 'ping' }); }, 10000);
      showMessage('Подключение...', 1000);
    }

    init();
  </script>
</body>
</html>
