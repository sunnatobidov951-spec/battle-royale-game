<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Royale - Pro 3D Edition</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #050505; font-family: 'Segoe UI', Tahoma, sans-serif;
            touch-action: none; user-select: none;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Экран загрузки модели */
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 22px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none; z-index: 10; background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Тактический HUD */
        .hud {
            position: absolute; pointer-events: none; color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: 600;
        }
        #top-left { top: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; }
        #top-right { top: 20px; right: 20px; text-align: right; display: flex; flex-direction: column; gap: 8px; }
        
        .panel {
            background: rgba(15, 20, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px); border-radius: 6px; padding: 8px 14px; font-size: 13px;
        }
        .health-bar-container { width: 140px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .health-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff416c, #ff4b2b); }
        .weapon-name { color: #00ffcc; font-size: 15px; font-weight: bold; }
        .ammo-count { font-size: 20px; color: #ffcc00; font-family: monospace; }

        /* Элементы управления (Геймпад) */
        .controls { position: absolute; bottom: 30px; width: 100%; pointer-events: none; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; }
        .joystick-zone { width: 140px; height: 140px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; position: relative; backdrop-filter: blur(4px); }
        .joystick-knob { width: 60px; height: 60px; background: rgba(255,255,255,0.4); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; position: absolute; top: 40px; left: 40px; pointer-events: none; }
        
        .action-buttons { pointer-events: auto; display: flex; gap: 15px; align-items: flex-end; }
        .btn { border-radius: 50%; border: none; font-weight: bold; color: #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.5); outline: none; cursor: pointer; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
        #btn-fire { background: linear-gradient(135deg, #ff4b2b, #ff416c); width: 90px; height: 90px; font-size: 18px; border: 2px solid rgba(255,255,255,0.4); }
        #btn-reload, #btn-shop { background: linear-gradient(135deg, #2193b0, #6dd5ed); width: 65px; height: 65px; font-size: 12px; }

        /* Прицел */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        .cross-line { position: absolute; background: rgba(0, 255, 204, 0.8); }
        .c-top { top: 0; left: 7px; width: 2px; height: 6px; }
        .c-bottom { bottom: 0; left: 7px; width: 2px; height: 6px; }
        .c-left { top: 7px; left: 0; width: 6px; height: 2px; }
        .c-right { top: 7px; right: 0; width: 6px; height: 2px; }
    </style>
</head>
<body>

    <div id="loading">Загрузка 3D-модели бойца...</div>
    <div id="canvas-container"></div>
    
    <div id="crosshair">
        <div class="cross-line c-top"></div>
        <div class="cross-line c-bottom"></div>
        <div class="cross-line c-left"></div>
        <div class="cross-line c-right"></div>
    </div>

    <!-- HUD -->
    <div id="top-left" class="hud">
        <div class="panel">
            <div>ЗДОРОВЬЕ</div>
            <div class="health-bar-container"><div id="health-fill" class="health-fill"></div></div>
        </div>
        <div class="panel">🛡️ БРОНЯ: <span style="color: #00ffcc;">100</span></div>
    </div>
    
    <div id="top-right" class="hud">
        <div class="panel">
            <div class="weapon-name">Assault Rifle M4</div>
            <div class="ammo-count">30 / <span style="font-size: 14px; color: #aaa;">120</span></div>
        </div>
    </div>

    <!-- Управление -->
    <div class="controls">
        <div id="joystick" class="joystick-zone">
            <div id="joystick-knob" class="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <button id="btn-shop" class="btn">Магазин</button>
            <button id="btn-reload" class="btn">Перез.</button>
            <button id="btn-fire" class="btn">ОГОНЬ</button>
        </div>
    </div>

    <!-- Библиотеки Three.js и GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        const container = document.getElementById('canvas-container');
        const loadingEl = document.getElementById('loading');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Освещение
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        sunLight.position.set(150, 300, 150);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Земля и дорога
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(600, 600),
            new THREE.MeshStandardMaterial({ color: 0x3b5928, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(10, 600),
            new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 })
        );
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.02;
        road.receiveShadow = true;
        scene.add(road);

        // Переменные для анимации 3D модели
        let mixer = null;
        let animations = {};
        let currentAction = null;
        let playerModel = null;

        // Загрузка профессиональной 3D-модели с анимацией бега
        const loader = new THREE.GLTFLoader();
        loader.load(
            'https://threejs.org/examples/models/gltf/Soldier.glb',
            function (gltf) {
                playerModel = gltf.scene;
                playerModel.scale.set(0.9, 0.9, 0.9);
                playerModel.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                scene.add(playerModel);

                // Настройка анимаций персонажа
                mixer = new THREE.AnimationMixer(playerModel);
                gltf.animations.forEach((clip) => {
                    animations[clip.name] = mixer.clipAction(clip);
                });

                // Включаем Idle (стояние на месте) по умолчанию
                if (animations['Idle']) {
                    currentAction = animations['Idle'];
                    currentAction.play();
                }

                // Убираем экран загрузки
                loadingEl.style.display = 'none';
            },
            undefined,
            function (error) {
                console.error(error);
                loadingEl.innerText = 'Ошибка загрузки 3D модели!';
            }
        );

        // Джойстик управления
        let moveX = 0, moveZ = 0;
        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('joystick-knob');
        let isDragging = false, joyCenter = { x: 0, y: 0 };

        joystick.addEventListener('pointerdown', (e) => {
            isDragging = true;
            const rect = joystick.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let dx = e.clientX - joyCenter.x;
            let dy = e.clientY - joyCenter.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let maxDist = 45;
            if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxDist;
            moveZ = dy / maxDist;
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            moveX = 0; moveZ = 0;
            knob.style.transform = `translate(0px, 0px)`;
        });

        // Функция плавной смены анимаций
        function switchAnimation(name) {
            if (!animations[name]) return;
            if (currentAction === animations[name]) return;
            
            let newAction = animations[name];
            newAction.reset();
            newAction.play();
            if (currentAction) {
                currentAction.crossFadeTo(newAction, 0.2, true);
            }
            currentAction = newAction;
        }

        const clock = new THREE.Clock();

        // Главный цикл рендеринга
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) mixer.update(delta);

            if (playerModel) {
                const isMoving = (moveX !== 0 || moveZ !== 0);

                if (isMoving) {
                    playerModel.position.x += moveX * 0.25;
                    playerModel.position.z += moveZ * 0.25;
                    playerModel.rotation.y = Math.atan2(moveX, moveZ);

                    // Переключаем на бег (Run) при движении
                    if (animations['Run']) {
                        switchAnimation('Run');
                    } else if (animations['Walk']) {
                        switchAnimation('Walk');
                    }
                } else {
                    // Возвращаем в режим ожидания (Idle)
                    if (animations['Idle']) {
                        switchAnimation('Idle');
                    }
                }

                // Плавная камера от третьего лица следит за бойцом
                camera.position.x = playerModel.position.x - Math.sin(playerModel.rotation.y) * 5.5;
                camera.position.y = playerModel.position.y + 2.8;
                camera.position.z = playerModel.position.z - Math.cos(playerModel.rotation.y) * 5.5;
                camera.lookAt(playerModel.position.x, playerModel.position.y + 1.0, playerModel.position.z);
            }

            renderer.render(scene, camera);
        }

        animate();

        // Адаптация под размер экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
