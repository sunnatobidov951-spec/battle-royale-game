<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Royale</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0a; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }

    /* ---------- Экран поворота ---------- */
    #rotateHint {
      position:fixed; inset:0; background:#000; color:#fff; z-index:9999;
      display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:20px;
    }
    #rotateHint.show { display:flex; }
    #rotateHint .icon { font-size:48px; animation:rot 1.6s ease-in-out infinite; }
    @keyframes rot { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(90deg);} }

    /* ---------- Игровой canvas ---------- */
    #gameCanvas { position:fixed; inset:0; width:100%; height:100%; background:#3a4a2f; display:block; }

    /* ---------- HUD верх ---------- */
    #hudTop {
      position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
      padding:10px 14px; pointer-events:none; z-index:50;
    }
    .hp-wrap { display:flex; flex-direction:column; gap:4px; pointer-events:none; }
    .bar-bg { width:160px; height:14px; background:rgba(0,0,0,0.5); border-radius:7px; overflow:hidden; border:1px solid rgba(255,255,255,0.2); }
    .bar-fill { height:100%; border-radius:7px; transition:width 0.2s; }
    #hpFill { background:linear-gradient(90deg,#e74c3c,#ff6b5b); }
    #armorFill { background:linear-gradient(90deg,#3498db,#5dade2); width:0%; }
    .bar-label { font-size:11px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.8); }
    #zoneInfo { color:#fff; font-size:12px; text-align:right; text-shadow:0 1px 3px rgba(0,0,0,0.8); }
    #killFeed { position:fixed; top:60px; right:14px; display:flex; flex-direction:column; gap:4px; align-items:flex-end; z-index:50; pointer-events:none; }
    .kill-msg { background:rgba(0,0,0,0.55); color:#fff; font-size:12px; padding:4px 10px; border-radius:6px; animation:fadeout 4s forwards; }
    @keyframes fadeout { 0%,70%{opacity:1;} 100%{opacity:0;} }

    #ammoHud { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); color:#fff; font-size:14px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,0.8); z-index:50; pointer-events:none; text-align:center; }
    #weaponName { font-size:11px; opacity:0.85; font-weight:500; }

    /* ---------- Джойстик (слева) ---------- */
    #joystickZone { position:fixed; left:0; bottom:0; width:45%; height:60%; z-index:60; }
    #joyBase {
      position:absolute; width:110px; height:110px; border-radius:50%;
      background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.35);
      display:none; align-items:center; justify-content:center;
    }
    #joyStick {
      width:48px; height:48px; border-radius:50%;
      background:rgba(255,255,255,0.55); border:1px solid rgba(255,255,255,0.7);
    }

    /* ---------- Правая сторона: кнопки ---------- */
    #rightControls { position:fixed; right:0; bottom:0; width:55%; height:100%; z-index:60; pointer-events:none; }
    .ctrl-btn {
      position:absolute; pointer-events:auto; border-radius:50%; display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:11px; font-weight:700; text-align:center; line-height:1.2;
      background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.4);
      -webkit-tap-highlight-color:transparent;
      transition: background 0.05s;
    }
    .ctrl-btn:active, .ctrl-btn.active { background:rgba(255,255,255,0.35); }
    #btnFire {
      width:92px; height:92px; right:26px; bottom:80px;
      background:rgba(231,76,60,0.35); border-color:rgba(255,120,100,0.6);
      font-size:13px;
    }
    #btnAim { width:56px; height:56px; right:130px; bottom:150px; }
    #btnJump { width:56px; height:56px; right:26px; bottom:190px; }
    #btnCrouch { width:56px; height:56px; right:100px; bottom:60px; }
    #btnStand { width:50px; height:50px; right:170px; bottom:40px; font-size:10px; }
    #btnPickup { width:50px; height:50px; right:16px; bottom:290px; font-size:10px; }
    #btnShop { position:fixed; top:10px; left:50%; transform:translateX(-50%); pointer-events:auto; z-index:60;
      background:rgba(0,0,0,0.5); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:8px; padding:6px 16px; font-size:12px; display:none; }
    /* Кнопки переключения оружия */
    #weaponPrev, #weaponNext {
      position:fixed; bottom:70px; width:44px; height:44px; border-radius:50%;
      background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.3); color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:18px; z-index:55; pointer-events:auto;
    }
    #weaponPrev { left:10px; }
    #weaponNext { left:60px; }

    /* ---------- Прицел ---------- */
    #crosshair {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:22px; height:22px; z-index:40; pointer-events:none;
    }
    #crosshair::before, #crosshair::after {
      content:''; position:absolute; background:rgba(255,255,255,0.85);
    }
    #crosshair::before { width:2px; height:22px; left:10px; top:0; }
    #crosshair::after { width:22px; height:2px; top:10px; left:0; }

    /* ---------- Магазин ---------- */
    #shopOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; display:none; align-items:center; justify-content:center; }
    #shopOverlay.show { display:flex; }
    #shopBox { background:#1a1d24; border-radius:14px; padding:18px; width:min(520px,92%); max-height:80vh; overflow-y:auto; color:#fff; }
    #shopBox h3 { margin-bottom:12px; font-size:18px; }
    .shop-item { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:#262a33; border-radius:10px; margin-bottom:8px; }
    .shop-item button { background:#2563eb; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:700; font-size:13px; }
    .shop-item button:disabled { background:#555; }
    #closeShop { margin-top:10px; width:100%; padding:12px; background:#444; color:#fff; border:none; border-radius:10px; font-weight:700; }

    /* ---------- Экран статуса матча ---------- */
    #matchOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:300; display:none; align-items:center; justify-content:center; color:#fff; text-align:center; }
    #matchOverlay.show { display:flex; }
    #matchOverlay h1 { font-size:32px; margin-bottom:10px; }

    /* ---------- Индикатор соединения ---------- */
    #connectionStatus { position:fixed; top:6px; right:6px; color:#0f0; font-size:10px; z-index:70; pointer-events:none; text-shadow:0 0 4px #000; }
  </style>
</head>
<body>

  <div id="rotateHint"><div class="icon">📱</div><div>Поверните телефон горизонтально</div></div>

  <canvas id="gameCanvas"></canvas>
  <div id="crosshair"></div>

  <div id="hudTop">
    <div class="hp-wrap">
      <div class="bar-label" id="hpLabel">HP 100</div>
      <div class="bar-bg"><div class="bar-fill" id="hpFill" style="width:100%"></div></div>
      <div class="bar-bg"><div class="bar-fill" id="armorFill" style="width:0%"></div></div>
    </div>
    <div id="zoneInfo">Игроков жив: <span id="aliveCount">-</span></div>
  </div>

  <div id="killFeed"></div>

  <button id="btnShop">🛒 Магазин</button>

  <div id="ammoHud">
    <div id="weaponName">Пистолет</div>
    <div id="ammoCount">30 / 30</div>
  </div>

  <div id="joystickZone">
    <div id="joyBase"><div id="joyStick"></div></div>
  </div>

  <div id="rightControls">
    <div class="ctrl-btn" id="btnAim">🔭<br>Прицел</div>
    <div class="ctrl-btn" id="btnJump">⬆️<br>Прыжок</div>
    <div class="ctrl-btn" id="btnCrouch">⬇️<br>Присесть</div>
    <div class="ctrl-btn" id="btnStand">Встать</div>
    <div class="ctrl-btn" id="btnPickup">🎒<br>Взять</div>
    <div class="ctrl-btn" id="btnFire">🔫<br>ОГОНЬ</div>
  </div>

  <button id="weaponPrev">◀</button>
  <button id="weaponNext">▶</button>

  <div id="shopOverlay">
    <div id="shopBox">
      <h3>🛒 Магазин — Баланс: <span id="shopCurrency">0</span></h3>
      <div id="shopList"></div>
      <button id="closeShop">Закрыть</button>
    </div>
  </div>

  <div id="matchOverlay">
    <div>
      <h1 id="matchTitle"></h1>
      <div id="matchSub"></div>
    </div>
  </div>

  <div id="connectionStatus">● Подключено</div>

<script>
(function() {
  // ============================================================
  //  1. Ориентация
  // ============================================================
  function checkOrientation() {
    document.getElementById('rotateHint').classList.toggle('show', window.innerHeight > window.innerWidth);
  }
  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', checkOrientation);
  checkOrientation();

  // ============================================================
  //  2. WebSocket с автоматическим переподключением
  // ============================================================
  let ws = null;
  let reconnectAttempt = 0;
  const MAX_RECONNECT_ATTEMPTS = 10;
  const BASE_DELAY = 500;
  let myId = null;
  let worldSize = 600;
  let weaponsConfig = {};
  let latestState = null;
  let myPlayer = null;

  const statusEl = document.getElementById('connectionStatus');

  function connectWebSocket() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(protocol + '//' + location.host);

    ws.onopen = () => {
      console.log('WebSocket connected');
      statusEl.textContent = '● Подключено';
      statusEl.style.color = '#0f0';
      reconnectAttempt = 0;
    };

    ws.onmessage = (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch(e) { return; }
      handleServerMessage(data);
    };

    ws.onclose = () => {
      console.warn('WebSocket closed, reconnecting...');
      statusEl.textContent = '● Потеря связи';
      statusEl.style.color = '#f00';
      ws = null;
      scheduleReconnect();
    };

    ws.onerror = (err) => {
      console.error('WebSocket error', err);
      // Закрытие вызовет onclose, где будет переподключение
    };
  }

  function scheduleReconnect() {
    if (reconnectAttempt >= MAX_RECONNECT_ATTEMPTS) {
      statusEl.textContent = '✖ Не удалось подключиться';
      return;
    }
    const delay = Math.min(10000, BASE_DELAY * Math.pow(1.5, reconnectAttempt));
    reconnectAttempt++;
    setTimeout(connectWebSocket, delay);
  }

  // Первое подключение
  connectWebSocket();

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    }
  }

  // ============================================================
  //  3. Обработка сообщений от сервера
  // ============================================================
  function handleServerMessage(data) {
    if (data.type === 'init') {
      myId = data.id;
      worldSize = data.worldSize;
      weaponsConfig = data.config.weapons || {};
    } else if (data.type === 'state') {
      latestState = data;
      myPlayer = data.players.find(p => p.id === myId) || null;
      updateHud();
      updateShopButton();
      renderShopIfOpen();
    } else if (data.type === 'death') {
      if (data.playerId === myId) showMatchOverlay('Вы погибли', '');
    } else if (data.type === 'hit') {
      // можно добавить визуальный эффект
    } else if (data.type === 'winner') {
      showMatchOverlay(data.playerId === myId ? '🏆 Победа!' : 'Матч завершён', 'Победитель определён');
    } else if (data.type === 'draw') {
      showMatchOverlay('Ничья', 'Все выбыли');
    }
  }

  // ============================================================
  //  4. HUD и отображение
  // ============================================================
  function updateHud() {
    if (!myPlayer) return;
    const hp = Math.max(0, myPlayer.health);
    document.getElementById('hpFill').style.width = hp + '%';
    document.getElementById('hpLabel').textContent = 'HP ' + Math.round(hp);
    document.getElementById('armorFill').style.width = (myPlayer.armor || 0) + '%';

    const weapon = weaponsConfig[myPlayer.weapon] || { name: 'Без оружия' };
    document.getElementById('weaponName').textContent = weapon.name;
    const ammo = myPlayer.ammo ?? 0;
    const maxAmmo = myPlayer.maxAmmo ?? ammo; // если сервер не присылает maxAmmo, используем ammo
    document.getElementById('ammoCount').textContent = ammo + ' / ' + maxAmmo;

    document.getElementById('shopCurrency').textContent = myPlayer.currency || 0;

    const aliveP = latestState ? latestState.players.filter(p => p.alive).length : 0;
    const aliveB = (latestState && latestState.bots) ? latestState.bots.filter(b => b.alive).length : 0;
    document.getElementById('aliveCount').textContent = (aliveP + aliveB);
  }

  function updateShopButton() {
    const btn = document.getElementById('btnShop');
    if (latestState && latestState.matchActive && myPlayer && myPlayer.alive) {
      btn.style.display = 'block';
    } else {
      btn.style.display = 'none';
    }
  }

  function showMatchOverlay(title, sub) {
    document.getElementById('matchTitle').textContent = title;
    document.getElementById('matchSub').textContent = sub;
    document.getElementById('matchOverlay').classList.add('show');
    setTimeout(() => document.getElementById('matchOverlay').classList.remove('show'), 4500);
  }

  // ============================================================
  //  5. Джойстик (движение) — улучшен с pointer событиями
  // ============================================================
  const joyZone = document.getElementById('joystickZone');
  const joyBase = document.getElementById('joyBase');
  const joyStick = document.getElementById('joyStick');
  let joyPointerId = null;
  let joyCenter = { x:0, y:0 };
  const JOY_RADIUS = 55;

  function joyStart(clientX, clientY, pointerId) {
    joyPointerId = pointerId;
    joyCenter = { x: clientX, y: clientY };
    joyBase.style.left = (clientX - 55) + 'px';
    joyBase.style.top = (clientY - 55) + 'px';
    joyBase.style.display = 'flex';
    joyStick.style.transform = 'translate(0px,0px)';
    // Отправляем начальное состояние (нет движения)
    sendMoveInput(0, 0);
  }

  function joyMove(clientX, clientY) {
    let dx = clientX - joyCenter.x;
    let dy = clientY - joyCenter.y;
    const dist = Math.min(JOY_RADIUS, Math.sqrt(dx*dx + dy*dy));
    const angle = Math.atan2(dy, dx);
    const stickX = Math.cos(angle) * dist;
    const stickY = Math.sin(angle) * dist;
    joyStick.style.transform = `translate(${stickX}px, ${stickY}px)`;

    // Нормализованный вектор
    const threshold = 8;
    let nx = 0, ny = 0;
    if (dist > threshold) {
      nx = Math.cos(angle);
      ny = Math.sin(angle);
    }
    sendMoveInput(nx, ny);
  }

  function joyEnd() {
    joyPointerId = null;
    joyBase.style.display = 'none';
    sendMoveInput(0, 0);
  }

  // Отправка вектора движения (экранные координаты -> forward/backward/left/right)
  function sendMoveInput(nx, ny) {
    // ny < 0 => вверх (forward), ny > 0 => вниз (backward)
    // nx < 0 => влево, nx > 0 => вправо
    const input = {
      forward: ny < -0.3,
      backward: ny > 0.3,
      left: nx < -0.3,
      right: nx > 0.3,
    };
    send({ type: 'move-input', input });
  }

  // Pointer события для джойстика (работает и с тачем, и с мышью)
  joyZone.addEventListener('pointerdown', (e) => {
    if (joyPointerId !== null) return;
    e.preventDefault(); // чтобы не было прокрутки
    joyStart(e.clientX, e.clientY, e.pointerId);
    joyZone.setPointerCapture(e.pointerId);
  });

  joyZone.addEventListener('pointermove', (e) => {
    if (e.pointerId !== joyPointerId) return;
    e.preventDefault();
    joyMove(e.clientX, e.clientY);
  });

  joyZone.addEventListener('pointerup', (e) => {
    if (e.pointerId !== joyPointerId) return;
    e.preventDefault();
    joyEnd();
    joyZone.releasePointerCapture(e.pointerId);
  });

  joyZone.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== joyPointerId) return;
    joyEnd();
  });

  // ============================================================
  //  6. Поворот камеры (свайп по правой части)
  // ============================================================
  let camYaw = 0, camPitch = 0;
  let lookPointerId = null;
  let lookLastX = 0, lookLastY = 0;

  function isPointerOnButton(e) {
    // Проверяем, не попал ли указатель на элемент с классом ctrl-btn или его потомка
    let target = e.target;
    while (target) {
      if (target.classList && target.classList.contains('ctrl-btn')) return true;
      target = target.parentElement;
    }
    return false;
  }

  document.addEventListener('pointerdown', (e) => {
    // Поворот только если палец не на кнопке и не в джойстике (джойстик сам захватывает)
    if (e.pointerType === 'touch') {
      if (e.clientX < window.innerWidth * 0.42) return; // левая половина – джойстик
      if (isPointerOnButton(e)) return;
    } else {
      // для мыши разрешаем только если клик на canvas
      if (e.target !== canvas && !e.target.closest('#gameCanvas')) return;
    }
    if (lookPointerId !== null) return;
    lookPointerId = e.pointerId;
    lookLastX = e.clientX;
    lookLastY = e.clientY;
    e.preventDefault();
  });

  document.addEventListener('pointermove', (e) => {
    if (e.pointerId !== lookPointerId) return;
    const dx = e.clientX - lookLastX;
    const dy = e.clientY - lookLastY;
    lookLastX = e.clientX;
    lookLastY = e.clientY;
    camYaw -= dx * 0.005;
    camPitch = Math.max(-1.2, Math.min(1.2, camPitch - dy * 0.005));
    send({ type: 'rotate', yaw: camYaw, pitch: camPitch });
    e.preventDefault();
  });

  document.addEventListener('pointerup', (e) => {
    if (e.pointerId === lookPointerId) {
      lookPointerId = null;
      e.preventDefault();
    }
  });
  document.addEventListener('pointercancel', (e) => {
    if (e.pointerId === lookPointerId) lookPointerId = null;
  });

  // ============================================================
  //  7. Кнопки управления (унифицированные pointer)
  // ============================================================
  function setupButton(el, onDown, onUp) {
    if (!el) return;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      el.classList.add('active');
      if (onDown) onDown();
    });
    el.addEventListener('pointerup', (e) => {
      e.preventDefault();
      el.classList.remove('active');
      if (onUp) onUp();
    });
    el.addEventListener('pointercancel', (e) => {
      el.classList.remove('active');
      if (onUp) onUp();
    });
  }

  // Огонь (зажатие -> непрерывная стрельба)
  let firing = false, fireInterval = null;
  function startFire() {
    if (firing) return;
    firing = true;
    send({ type: 'shoot' });
    fireInterval = setInterval(() => {
      if (firing) send({ type: 'shoot' });
    }, 90);
  }
  function stopFire() {
    firing = false;
    clearInterval(fireInterval);
    fireInterval = null;
  }
  setupButton(document.getElementById('btnFire'), startFire, stopFire);

  // Прицел (зум)
  let zoomFactor = 1;
  function startAim() {
    zoomFactor = 1.6;
  }
  function stopAim() {
    zoomFactor = 1;
  }
  setupButton(document.getElementById('btnAim'), startAim, stopAim);

  // Прыжок (одиночное нажатие)
  setupButton(document.getElementById('btnJump'), () => send({ type: 'jump' }));

  // Присесть (зажатие -> true, отпускание -> остаётся в crouch? но мы отправляем при нажатии, а при отпускании ничего не делаем)
  // В оригинале: при нажатии отправляем true, при повторном нажатии на "Встать" отправляем false.
  // Реализуем так: btnCrouch отправляет crouch:true, btnStand отправляет crouch:false
  setupButton(document.getElementById('btnCrouch'), () => send({ type: 'crouch', value: true }));
  setupButton(document.getElementById('btnStand'), () => send({ type: 'crouch', value: false }));

  // Подобрать предмет
  setupButton(document.getElementById('btnPickup'), () => {
    if (!latestState || !myPlayer) return;
    let nearest = null, minD = Infinity;
    for (const item of latestState.loot) {
      const dx = item.position.x - myPlayer.position.x;
      const dz = item.position.z - myPlayer.position.z;
      const d = Math.sqrt(dx*dx + dz*dz);
      if (d < minD) { minD = d; nearest = item; }
    }
    if (nearest && minD < 5) send({ type: 'pickup', lootId: nearest.id });
  });

  // Переключение оружия (если сервер поддерживает массив оружий)
  // Предположим, что у игрока есть поле weapons (массив), и текущий индекс weaponIndex
  function switchWeapon(delta) {
    if (!myPlayer || !myPlayer.weapons || myPlayer.weapons.length < 2) return;
    let idx = myPlayer.weaponIndex || 0;
    idx = (idx + delta + myPlayer.weapons.length) % myPlayer.weapons.length;
    send({ type: 'switch-weapon', index: idx });
  }
  setupButton(document.getElementById('weaponPrev'), () => switchWeapon(-1));
  setupButton(document.getElementById('weaponNext'), () => switchWeapon(1));

  // ============================================================
  //  8. Магазин
  // ============================================================
  const btnShop = document.getElementById('btnShop');
  const shopOverlay = document.getElementById('shopOverlay');
  document.getElementById('closeShop').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    shopOverlay.classList.remove('show');
  });
  btnShop.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    renderShop();
    shopOverlay.classList.add('show');
  });

  function renderShop() {
    if (!latestState || !latestState.shop) return;
    const list = document.getElementById('shopList');
    list.innerHTML = '';
    latestState.shop.forEach(item => {
      const row = document.createElement('div');
      row.className = 'shop-item';
      const canAfford = myPlayer && (myPlayer.currency || 0) >= item.price;
      row.innerHTML = `<span>${item.name} — ${item.price}💰</span>`;
      const btn = document.createElement('button');
      btn.textContent = 'Купить';
      btn.disabled = !canAfford;
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        send({ type: 'shop-buy', itemId: item.id });
      });
      row.appendChild(btn);
      list.appendChild(row);
    });
  }

  function renderShopIfOpen() {
    if (shopOverlay.classList.contains('show')) renderShop();
  }

  // ============================================================
  //  9. Рендеринг (canvas)
  // ============================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Преобразование мировых координат в экранные с учётом масштаба (zoom)
  function worldToScreen(pos) {
    if (!myPlayer) return { x: canvas.width/2, y: canvas.height/2 };
    const scale = 6 * zoomFactor;
    const dx = (pos.x - myPlayer.position.x) * scale;
    const dz = (pos.z - myPlayer.position.z) * scale;
    return {
      x: canvas.width/2 + dx,
      y: canvas.height/2 + dz
    };
  }

  function draw() {
    // Очистка
    ctx.fillStyle = '#3a4a2f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (!latestState || !myPlayer) {
      requestAnimationFrame(draw);
      return;
    }

    // 1. Зона
    const zonePos = worldToScreen({ x: latestState.zone.x, z: latestState.zone.z });
    ctx.strokeStyle = 'rgba(80,160,255,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(zonePos.x, zonePos.y, latestState.zone.radius * 6 * zoomFactor, 0, Math.PI*2);
    ctx.stroke();

    // 2. Лут
    ctx.fillStyle = '#ffd54f';
    latestState.loot.forEach(item => {
      const p = worldToScreen(item.position);
      if (p.x > -20 && p.x < canvas.width+20 && p.y > -20 && p.y < canvas.height+20) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
        ctx.fill();
      }
    });

    // 3. Боты
    ctx.fillStyle = '#e74c3c';
    if (latestState.bots) {
      latestState.bots.forEach(b => {
        if (!b.alive) return;
        const p = worldToScreen(b.position);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
        ctx.fill();
      });
    }

    // 4. Игроки
    latestState.players.forEach(pl => {
      if (!pl.alive) return;
      const p = worldToScreen(pl.position);
      ctx.fillStyle = (pl.id === myId) ? '#2ecc71' : '#3498db';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 9, 0, Math.PI*2);
      ctx.fill();
      // направление взгляда
      if (pl.rotation && pl.rotation.yaw !== undefined) {
        const dirLen = 16 * zoomFactor;
        const dx = -Math.sin(pl.rotation.yaw) * dirLen;
        const dy = -Math.cos(pl.rotation.yaw) * dirLen;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + dx, p.y + dy);
        ctx.stroke();
      }
    });

    requestAnimationFrame(draw);
  }
  draw();

  // ============================================================
  //  10. Дополнительно: отображение статуса соединения
  // ============================================================
  // Пинг каждые 5 секунд
  setInterval(() => send({ type: 'ping' }), 5000);

})();
</script>
</body>
